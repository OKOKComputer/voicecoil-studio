name: deploy-pages
# Деплой src/ на GitHub Pages. Запускается вручную (Actions → deploy-pages → Run workflow):
# на приватном репозитории Pages доступны только на платном плане, поэтому автозапуск на push выключен.
# Перед первым запуском: Settings → Pages → Source: GitHub Actions.
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src
      - id: deployment
        uses: actions/deploy-pages@v4
